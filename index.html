    <!-- =========================================
         JAVASCRIPT CONTROLS
    ========================================== -->
    <script>
        // 1. Contact Popover Toggle
        const toggleBtn = document.getElementById('contactToggle');
        const closeBtn = document.getElementById('contactClose');
        const contactTab = document.getElementById('contactTab');

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            contactTab.classList.toggle('active');
        });

        closeBtn.addEventListener('click', () => {
            contactTab.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (!contactTab.contains(e.target) && e.target !== toggleBtn) {
                contactTab.classList.remove('active');
            }
        });

        // 2. Progressive Video Hover Logic (Low-Res First -> High-Res Swap)
const workLinks = document.querySelectorAll('.work-item[data-video]');

workLinks.forEach(link => {
    const videoId = link.getAttribute('data-video');
    const mainVideo = document.getElementById(videoId);

    if (!mainVideo) return;

    const lowResSrc = mainVideo.getAttribute('data-lowres');
    let lowResVideo = null;
    let isHovered = false;

    // Create low-res counterpart video dynamically
    if (lowResSrc) {
        lowResVideo = document.createElement('video');
        lowResVideo.src = lowResSrc;
        lowResVideo.muted = true;
        lowResVideo.loop = true;
        lowResVideo.playsInline = true;
        lowResVideo.preload = 'auto';
        
        // Append to container next to main video
        mainVideo.parentNode.appendChild(lowResVideo);
    }

    link.addEventListener('mouseenter', () => {
        isHovered = true;

        // Check if main high-res video is already cached/ready
        const isMainReady = mainVideo.readyState >= 3; // HAVE_FUTURE_DATA or higher

        if (isMainReady || !lowResVideo) {
            // High-res ready: Play directly
            mainVideo.classList.add('active');
            mainVideo.play().catch(err => console.log(err));
        } else {
            // High-res buffering: Play low-res instantly and load high-res in background
            lowResVideo.classList.add('active');
            lowResVideo.play().catch(err => console.log(err));

            // Start preloading high-res video
            mainVideo.load();

            // Swap when high-res is ready to play smoothly
            const onCanPlay = () => {
                if (isHovered) {
                    mainVideo.currentTime = lowResVideo.currentTime; // Sync timestamp
                    mainVideo.classList.add('active');
                    lowResVideo.classList.remove('active');

                    mainVideo.play().catch(err => console.log(err));
                    lowResVideo.pause();
                }
                mainVideo.removeEventListener('canplaythrough', onCanPlay);
            };

            mainVideo.addEventListener('canplaythrough', onCanPlay, { once: true });
        }
    });

    link.addEventListener('mouseleave', () => {
        isHovered = false;

        // Reset and pause both videos
        [mainVideo, lowResVideo].forEach(vid => {
            if (vid) {
                vid.classList.remove('active');
                vid.pause();
                vid.currentTime = 0;
            }
        });
    });
});
    </script>
