<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Li Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================================
         HEADER / TOP NAVIGATION
    ========================================== -->
    <header class="header">
        <div class="logo">
            <h1>Noah Li</h1>
        </div>

        <!-- Three dots button -->
        <button class="dots-btn" id="contactToggle" aria-label="Open contact info">
            •••
        </button>

        <!-- Contact Popover / Tab -->
        <div class="contact-tab" id="contactTab">
            <button class="close-btn" id="contactClose">&times;</button>
            <h3>Contact</h3>
            <p><a href="mailto:znlxins@gmail.com">znlxins@gmail.com</a></p>
            <p><a href="https://www.instagram.com/znlxin/" target="_blank" rel="noopener">Instagram ↗</a></p>
            <p class="location">Calgary, AB</p>
        </div>
    </header>

    <!-- =========================================
         CENTER VIDEO PREVIEW CONTAINER
    ========================================== -->
    <div class="video-preview-container">
        <!-- Added preload="auto" to all videos for instant playback on hover -->
        <video id="video-1" src="assets/videos/jandae/jandae1_1_1.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-2" src="assets/videos/her/directed shot_1.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-3" src="assets/videos/angel/angel c1_1_1.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-4" src="assets/videos/milkrun/4_1_1.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-5" src="assets/videos/project-5.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-6" src="assets/videos/project-6.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-7" src="assets/videos/project-7.mp4" muted loop playsinline preload="auto"></video>
        <video id="video-8" src="assets/videos/project-8.mp4" muted loop playsinline preload="auto"></video>
    </div>

    <!-- =========================================
         SELECTED WORKS (FOOTER INLINE LINKS)
    ========================================== -->
    <main class="works-container">
        <span class="label">Selected work:</span>
        <div class="works-list">
            <a href="projects/jandae.html" class="work-item" data-video="video-1">Jandae SS2026,<sup>1</sup></a>
            <a href="projects/her.html" class="work-item" data-video="video-2">Her,<sup>2</sup></a>
            <a href="projects/angel.html" class="work-item" data-video="video-3">Angel,<sup>3</sup></a>
            <a href="projects/milkrun.html" class="work-item" data-video="video-4">Milkrun '25',<sup>4</sup></a>
            <a href="works.html" class="work-item">All Work,<sup>5</sup></a>
        </div>
    </main>

    <!-- =========================================
         JAVASCRIPT CONTROLS
    ========================================== -->
    <script>
        // 1. Contact Popover Toggle
        const toggleBtn = document.getElementById('contactToggle');
        const closeBtn = document.getElementById('contactClose');
        const contactTab = document.getElementById('contactTab');

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            contactTab.classList.toggle('active');
        });

        closeBtn.addEventListener('click', () => {
            contactTab.classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (!contactTab.contains(e.target) && e.target !== toggleBtn) {
                contactTab.classList.remove('active');
            }
        });

        // 2. Video Hover Logic
        const workLinks = document.querySelectorAll('.work-item[data-video]');

        workLinks.forEach(link => {
            const videoId = link.getAttribute('data-video');
            const targetVideo = document.getElementById(videoId);

            if (!targetVideo) return;

            let playPromise;

            link.addEventListener('mouseenter', () => {
                targetVideo.classList.add('active');
                targetVideo.muted = true; // Ensures browser allows playback

                playPromise = targetVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Playback interrupted or blocked:", error);
                    });
                }
            });

            link.addEventListener('mouseleave', () => {
                targetVideo.classList.remove('active');

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        targetVideo.pause();
                        targetVideo.currentTime = 0;
                    }).catch(() => {
                        targetVideo.pause();
                    });
                } else {
                    targetVideo.pause();
                }
            });
        });
    </script>
</body>
</html>
